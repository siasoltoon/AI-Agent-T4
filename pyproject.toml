[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-t4"
version = "1.0.0"
description = "Terminal-first autonomous AI agent runtime for Colab and NVIDIA T4"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "psutil>=6,<8",
  "rich>=13,<15",
]

[project.scripts]
agent = "terminal_ui.cli:main"

[tool.setuptools.packages.find]
include = ["agent_core*", "config*", "linux_runtime*", "model_runtime*", "terminal_ui*"]
